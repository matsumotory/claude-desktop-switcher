[package]
name = "csw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Claude Desktop Switcher"

[[bin]]
name = "csw"
path = "src/main.rs"

[dependencies]
csw-core = { path = "../core" }
clap = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }

# Restores the default SIGPIPE action at startup (see restore_default_sigpipe).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
