name: Release notes

# The release workflow calls this after all asset jobs, including releases made
# with GITHUB_TOKEN. A reviewed notes-file push can also repair an existing
# release without rebuilding binaries, uploading assets, or changing tags.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag with a committed English source (e.g. v0.24.7)"
        required: true
        type: string
  push:
    branches: [main]
    paths: ['.github/release-notes/*.en.md']

permissions:
  contents: read

jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tags
        name: Select exact release tags
        env:
          TAG_NAME: ${{ inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from publish_release_notes import changed_tags
          from release_notes import validate_tag
          tag = os.environ['TAG_NAME']
          if tag:
              validate_tag(tag)
              tags = [tag]
          else:
              tags = changed_tags(os.environ['BEFORE_SHA'], os.environ['AFTER_SHA'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + json.dumps(tags) + '\n')
          PY

  notes:
    needs: targets
    if: needs.targets.outputs.tags != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.targets.outputs.tags) }}
    # Serialize only the same tag. Different tags cannot displace each other's
    # pending backfill; the latest main source wins even for a slow release run.
    concurrency:
      group: release-notes-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Assemble, write, and verify the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ matrix.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ -z "$REQUESTED_TAG" ]; then
            python3 .github/scripts/publish_release_notes.py --existing "$TAG_NAME"
          else
            python3 .github/scripts/publish_release_notes.py "$TAG_NAME"
          fi
