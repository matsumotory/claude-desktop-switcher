name: Test release notes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-notes-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test body assembly and publishing safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*release_notes.py' -v
      - name: Require reviewed English notes for the manifest version
        run: python3 .github/scripts/release_notes.py --validate-current
