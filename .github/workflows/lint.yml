name: Lint

# Heavy macOS job: run on PRs only and cancel superseded runs to save minutes.
on:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Clippy and rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain version and the clippy/rustfmt components are pinned by
      # rust-toolchain.toml, which rustup auto-installs on first cargo use.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Japanese copy puts no space between Japanese and Latin text or code
      # (japanese-typography-qa §5). Runs even when an earlier step failed, so
      # one push reports both the Rust lint and the spacing.
      - name: Check spacing between Japanese and Latin text
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ja_spacing.py --check
